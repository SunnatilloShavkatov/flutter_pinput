name: flutter_pinput
version: 2.0.0
description: "Pin code input (OTP) text field, iOS SMS autofill, Android SMS autofill One Time Code, Password, Passcode, Captcha, Security, Coupon, Wowcher, 2FA, Two step verification"
homepage: https://github.com/SunnatilloShavkatov/flutter_pinput.git
repository: https://github.com/SunnatilloShavkatov/flutter_pinput.git
issue_tracker: https://github.com/SunnatilloShavkatov/flutter_pinput/issues
topics:
  - otp
  - pin-input
  - pin-code
  - passcode
  - sms-autofill

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  cupertino_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  analysis_lints: ^1.1.0